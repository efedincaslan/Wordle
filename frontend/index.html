<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Efe’s Daily Word</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Efe’s Daily Word</h1>
      <div id="status" class="status" aria-live="polite"></div>
    </header>

    <main class="main">
      <div class="cheer-wrapper">
        <img src="assets/cheerleader.gif" alt="Cheerleader cheering" class="cheer cheer-left" />

        <section class="game">
          <div id="grid" class="grid" role="application" aria-label="Word grid"></div>
          <div class="hint">Type a 5-letter word. Press Enter to submit.</div>
          <div class="subhint">Backspace deletes. You have 6 tries.</div>
        </section>

        <img src="assets/cheerleader.gif" alt="Cheerleader cheering" class="cheer cheer-right" />
      </div>

      <div class="keyboard" id="keyboard" aria-label="On-screen keyboard"></div>
    </main>
  </div>

  <!-- End Game Modal (MUST be before app.js) -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-top">
        <div>
          <div id="modalTitle" class="modal-title">Results</div>
          <div id="modalSubtitle" class="modal-subtitle"></div>
        </div>
        <button id="closeModal" class="modal-close" type="button" aria-label="Close">✕</button>
      </div>

      <!-- NEW: big end message area -->
      <div id="endMessage" class="end-message"></div>
      <div id="revealAnswer" class="reveal-answer"></div>

      <div class="stats">
        <div class="stat">
          <div class="stat-num" id="statPlayed">0</div>
          <div class="stat-label">Played</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="statWinPct">0%</div>
          <div class="stat-label">Win %</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="statStreak">0</div>
          <div class="stat-label">Streak</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="statMaxStreak">0</div>
          <div class="stat-label">Max</div>
        </div>
      </div>

      <div class="sharebox">
        <div class="share-label">Share your result</div>
        <pre id="shareText" class="share-text"></pre>
        <div class="share-actions">
          <button id="copyShare" class="share" type="button">Copy</button>
          <button id="newGameHint" class="ghost" type="button" disabled>Come back tomorrow</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
